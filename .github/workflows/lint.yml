name: Lint

on:
  # Run each time we push and pull requests
  push:
  pull_request:
  # Cron job
  # https://help.github.com/en/actions/automating-your-workflow-with-github-actions/events-that-trigger-workflows#scheduled-events-schedule
  schedule:
    # https://crontab.guru/#0_0_1_*_*
    - cron: "0 0 1 * *"

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # pylint needs the requirements to do the checks as the pre-commit repo is local
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pre-commit pylint
      - name: Lint
        run: pre-commit run --all-files --config .pre-commit-config.yml
