name: Test

on:
  # Run each time we push and pull requests
  push:
  pull_request:
  # Cron job
  # https://help.github.com/en/actions/automating-your-workflow-with-github-actions/events-that-trigger-workflows#scheduled-events-schedule
  schedule:
    # https://crontab.guru/#0_0_1_*_*
    - cron: "0 0 1 * *"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # BOUT++ 5.2.0, built by .github/workflows/image.yml and pinned by digest
      IMAGE: ghcr.io/celma-project/celma-env@sha256:8ac515c6973d1df6e0a89da1a3178fab3d5276220b57f787bbc915450474c40e

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull the build image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"

      - name: Build every target
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" bash -c '
            set -e
            cmake -S . -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/build'

      - name: Filter test
        run: |
          docker run --rm -v "$PWD:/work" -w /work/tests/radialLowPass "$IMAGE" \
            ./radialLowPass -d data

      - name: Regression test of the models
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" \
            python3 tests/regression/regression.py

      - name: Operator errors of the method of exact solutions cases
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" \
            python3 tests/regression/mes.py

      - name: Keep the numbers of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-numbers
          path: |
            recorded-reference.json
            recorded-mes.json
          if-no-files-found: ignore
