name: Test

on:
  # Run each time we push and pull requests
  push:
  pull_request:
  # Cron job
  # https://help.github.com/en/actions/automating-your-workflow-with-github-actions/events-that-trigger-workflows#scheduled-events-schedule
  schedule:
    # https://crontab.guru/#0_0_1_*_*
    - cron: "0 0 1 * *"

jobs:
  test:
    runs-on: ubuntu-latest
    container: loeiten/celma_env:latest
    env:
      # Container jobs set HOME to /github/home, the makefiles look in $HOME
      HOME: /root

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Build every target
        run: |
          set -e
          for makefile in $(find . -name makefile | sort); do
            echo "::group::$makefile"
            make -C "$(dirname "$makefile")"
            echo "::endgroup::"
          done

      - name: Filter test
        run: |
          set -e
          cd tests/radialLowPass
          ./radialLowPass -d data

      - name: Regression test of the models
        run: python3 tests/regression/regression.py
