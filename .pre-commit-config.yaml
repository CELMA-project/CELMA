# Lint runs every hook here: `pre-commit run --all-files`.
# Update the versions with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # C++: clang-format reads the repository's .clang-format (style=file)
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c]
  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint
        args:
          - --filter=-legal/copyright,-build/include_order,-whitespace/comments,-whitespace/indent,-whitespace/line_length,-build/include_subdir
        # Filters beyond the old two:
        # whitespace/comments: clang-format puts one space before a trailing
        #   comment (SpacesBeforeTrailingComments: 1), cpplint wants two.
        # whitespace/indent: clang-format puts public:/private: at column 0
        #   (AccessModifierOffset: -2), cpplint wants them indented one space.
        # whitespace/line_length: clang-format enforces ColumnLimit 80; its one
        #   space before the comment of a long header guard's #endif loses
        #   cpplint's exemption for that line.
        # build/include_subdir: each model and test is a standalone BOUT++
        #   build with no project include root, so a header beside its source
        #   is named without a directory.
