[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "D", "PL", "C90"]
# Deferred to the card "CELMA deeper test coverage": these rules still have
# findings after ruff's safe fixes. Their fixes are unsafe or manual and could
# change behaviour, so they wait until the tests can catch that, and must be
# enabled there. F401 has a safe fix, but the notebooks eval() input-file
# strings such as "log(sqrt(mu/(2.0*pi)))", so an import ruff sees as unused
# can be needed at run time.
ignore = [
    "B007",    # unused-loop-control-variable
    "B905",    # zip-without-explicit-strict
    "C901",    # complex-structure
    "D100",    # undocumented-public-module
    "D102",    # undocumented-public-method
    "D103",    # undocumented-public-function
    "D200",    # unnecessary-multiline-docstring
    "D205",    # missing-blank-line-after-summary
    "D400",    # missing-trailing-period
    "D401",    # non-imperative-mood
    "E402",    # module-import-not-at-top-of-file
    "E501",    # line-too-long
    "E711",    # none-comparison
    "E721",    # type-comparison
    "E741",    # ambiguous-variable-name
    "F401",    # unused-import
    "F811",    # redefined-while-unused
    "F841",    # unused-variable
    "PLC0206", # dict-index-missing-items
    "PLR0912", # too-many-branches
    "PLR1704", # redefined-argument-from-local
    "PLR2004", # magic-value-comparison
    "PLW0642", # self-or-cls-assignment
    "PLW2901", # redefined-loop-name
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
